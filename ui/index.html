<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Digitale Visitenkarten</title></head><body>
<div class="app"><div class="head"><div><h1>Digitale Visitenkarten</h1><p>Nutzer anlegen und Frontendkarten pflegen.</p></div><button id="newBtn">+ Neue Karte</button></div>
<div id="notice" class="notice"></div><div class="grid"><aside><h2>Karten</h2><div id="list" class="list"></div></aside><section><form id="form"><input type="hidden" id="id"><div class="row"><label>Slug<input id="slug" required placeholder="maik"></label><label>Aktiv<select id="active"><option value="1">Ja</option><option value="0">Nein</option></select></label></div><div class="row"><label>Vorname<input id="firstName"></label><label>Nachname<input id="lastName"></label></div><label>Anzeigename<input id="displayName" placeholder="Maik Röseler"></label><label>Position<input id="position" placeholder="Geschäftsführer | CEO"></label><label>Firma<input id="company" value="Four & more GmbH"></label><div class="row"><label>Telefon<input id="phone"></label><label>E-Mail<input id="email" type="email"></label></div><label>Website<input id="website" placeholder="https://four-more.net"></label><label>Logo-URL<input id="logoUrl" placeholder="https://.../logo.svg"></label><div class="row"><label>Straße<input id="street"></label><label>PLZ<input id="postalCode"></label></div><div class="row"><label>Ort<input id="city"></label><label>Land<input id="country" value="Germany"></label></div><label>Marken (JSON)<textarea id="brandsJson" rows="7" placeholder='[{"name":"Eclipse","logoUrl":"https://...","url":"https://..."}]'></textarea></label><div class="row"><label>Impressum-URL<input id="imprintUrl"></label><label>Datenschutz-URL<input id="privacyUrl"></label></div><label>Footer-Claim<input id="footerClaim" value="QUALITÄT FÜR GENERATIONEN"></label><div class="buttons"><button type="submit">Speichern</button><button type="button" id="openBtn" class="secondary">Frontend öffnen</button><button type="button" id="deleteBtn" class="danger">Löschen</button></div></form></section></div></div><script src="app.js"></script></body></html>
